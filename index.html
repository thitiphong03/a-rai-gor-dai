<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อเข้าเรียนด้วยตัวเอง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f7ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-semibold text-blue-600 mb-2">🎓 Student Self Check-In</h1>
            <p class="text-gray-500">ระบบเช็คชื่อเข้าเรียนอัตโนมัติสำหรับนักศึกษา</p>
        </header>

        <div class="grid grid-cols-1 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-md border border-blue-100">
                <h2 class="text-xl font-medium text-blue-500 mb-4 border-b pb-2">กรอกข้อมูลเพื่อเช็คชื่อ</h2>
                
                <form id="checkInForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อวิชา <span class="text-red-500">*</span></label>
                            <input type="text" id="subject" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="เช่น เทคโนโลยีเว็บ">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">ชื่ออาจารย์ผู้สอน <span class="text-red-500">*</span></label>
                            <input type="text" id="teacher" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="เช่น ดร.สมชาย ใจดี">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">รหัสนักศึกษา <span class="text-red-500">*</span></label>
                            <input type="text" id="studentId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="เช่น 65010023">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อ-นามสกุล ของตัวเอง <span class="text-red-500">*</span></label>
                            <input type="text" id="studentName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="เช่น สมหมาย รักเรียน">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">ห้องชั้นเลขที่ / ห้องเรียน <span class="text-red-500">*</span></label>
                            <input type="text" id="classroom" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="เช่น SC-402 หรือ ม.6/1">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-md shadow-blue-200 cursor-pointer flex justify-center items-center">
                        <span id="btnText">📍 บันทึกการเข้าเรียน (Check-In)</span>
                    </button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                <h2 class="text-xl font-medium text-gray-700 mb-4 flex justify-between items-center">
                    <span>📋 ประวัติการเช็คชื่อสำเร็จ (ในเซสชันนี้)</span>
                    <span id="logCount" class="text-sm bg-blue-100 text-blue-600 px-2.5 py-0.5 rounded-full font-normal">0 รายการ</span>
                </h2>

                <div id="logsContainer" class="space-y-4">
                    <p id="noData" class="text-center text-gray-400 py-6">ยังไม่มีประวัติการเช็คชื่อในระบบ</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-200 mt-8 bg-white">
        © 2026 Student Self Check-In System • Powered by Google Apps Script
    </footer>

    <script>
        // 🛑 ใส่ URL ที่ได้จากขั้นตอนการ Deploy Google Apps Script ตรงนี้ 🛑
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypGIXqtL1kFtgAbbiW45rc7ZEZrHCyD1lbyK-481N9cDTf2Xg3AH35-haUfHNqhHrjhQ/exec";
        const form = document.getElementById('checkInForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const logsContainer = document.getElementById('logsContainer');
        const noDataText = document.getElementById('noData');
        const logCountBadge = document.getElementById('logCount');

        let localLogs = [];

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // ปิดการใช้งานปุ่มป้องกันการกดซ้ำ
            submitBtn.disabled = true;
            btnText.innerHTML = "⏳ กำลังบันทึกข้อมูลเข้าสู่ระบบ...";
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            // บันทึกวันเวลาปัจจุบันโดยอัตโนมัติในฝั่ง Client
            const now = new Date();
            const timestampStr = now.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });

            // รวบรวมข้อมูลจากฟอร์ม
            const formData = {
                timestamp: timestampStr,
                subject: document.getElementById('subject').value.trim(),
                teacher: document.getElementById('teacher').value.trim(),
                studentId: document.getElementById('studentId').value.trim(),
                studentName: document.getElementById('studentName').value.trim(),
                classroom: document.getElementById('classroom').value.trim()
            };

            // ตรวจสอบว่าได้กรอก URL ของตัวเองหรือยัง
            if (WEB_APP_URL.includes("วาง_URL")) {
                alert("กรุณานำ URL จาก Google Apps Script มาใส่ในโค้ด JavaScript ก่อนใช้งานครับ!");
                resetButton();
                return;
            }

            try {
                // ส่งข้อมูลไปที่ Google Apps Script 
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // จำเป็นสำหรับ Google Apps Script หากไม่ต้องการทำ CORS ซับซ้อน
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // เนื่องจากโหมด no-cors จะอ่าน response ตรงๆ ไม่ได้ แต่หากทำงานไม่เข้า catch แปลว่าส่งข้อมูลออกไปสำเร็จ
                // เพิ่มข้อมูลลงในระบบจำลองแสดงผลหน้าเว็บทันที
                addLogToSummary(formData);
                alert("✨ บันทึกข้อมูลเข้าเรียนสำเร็จและส่งไปยัง Google Sheet แล้ว!");
                
                // เคลียร์เฉพาะข้อมูลนักศึกษาและห้องเรียน (คงวิชาและอาจารย์ไว้เผื่อเช็คต่อ)
                document.getElementById('studentId').value = '';
                document.getElementById('studentName').value = '';
                
            } catch (error) {
                console.error("Error saving data:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบฐานข้อมูล กรุณาลองใหม่อีกครั้ง");
            } finally {
                resetButton();
            }
        });

        function resetButton() {
            submitBtn.disabled = false;
            btnText.innerHTML = "📍 บันทึกการเข้าเรียน (Check-In)";
            submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        }

        function addLogToSummary(data) {
            // เอาข้อความ "ยังไม่มีข้อมูล" ออก
            if (noDataText) noDataText.style.display = 'none';

            localLogs.unshift(data); // เอาข้อมูลใหม่ขึ้นก่อน
            logCountBadge.innerText = `${localLogs.length} รายการ`;

            // สร้าง Card แสดงผลที่ดูง่ายและ Responsive
            const card = document.createElement('div');
            card.className = "bg-blue-50/50 p-4 rounded-xl border border-blue-100 flex flex-col md:flex-row md:justify-between md:items-center space-y-3 md:space-y-0 transition hover:bg-blue-50";
            
            card.innerHTML = `
                <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                        <span class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded font-medium">${data.classroom}</span>
                        <h3 class="font-medium text-gray-900">${data.studentId} - ${data.studentName}</h3>
                    </div>
                    <p class="text-sm text-gray-600">วิชา: <span class="font-medium text-gray-800">${data.subject}</span> | ผู้สอน: <span class="text-gray-700">${data.teacher}</span></p>
                </div>
                <div class="text-left md:text-right pt-2 md:pt-0 border-t md:border-t-0 border-gray-100">
                    <span class="text-xs font-medium text-blue-500 block">🕒 เวลาที่เช็คอิน</span>
                    <span class="text-sm text-gray-500 font-mono">${data.timestamp}</span>
                </div>
            `;

            // แทรกไว้ที่บนสุดของลิสต์
            logsContainer.insertBefore(card, logsContainer.firstChild);
        }
    </script>
</body>
</html>
